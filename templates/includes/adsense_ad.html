{% if google_adsense_client and ad_slot %}
<aside class="adsense-slot" aria-label="Publicidad">
    <p class="adsense-label">Publicidad</p>

    <ins
        class="adsbygoogle"
        style="display:block"
        data-ad-client="{{ google_adsense_client }}"
        data-ad-slot="{{ ad_slot }}"
        data-ad-format="auto"
        data-full-width-responsive="true"
    ></ins>

    <script>
        (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
</aside>
{% endif %}
