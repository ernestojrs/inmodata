{% extends "base.html" %}

{% block title %}Contraseña actualizada | InmoData{% endblock %}

{% block content %}
<section class="account-page">
    <div class="account-card">
        <p class="eyebrow">Acceso recuperado</p>

        <h1>Tu contraseña fue actualizada</h1>

        <p class="account-intro">
            Ya puedes iniciar sesión con tu correo electrónico o nombre de usuario.
        </p>

        <a class="button account-submit" href="{% url 'accounts:login' %}">
            Iniciar sesión
        </a>
    </div>
</section>
{% endblock %}
